
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun Belajar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Registrasi Akun Belajar</h2>
        <p>Lengkapi formulir di bawah ini dengan benar.</p>

        <form>
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Masukkan nama lengkap" required>

            <label>Alamat Email</label>
            <input type="email" placeholder="nama@contoh.com" required>

            <label>Kata Sandi</label>
            <input type="password" placeholder="Minimal 8 karakter" minlength="8" required>

            <label>Konfirmasi Kata Sandi</label>
            <input type="password" placeholder="Ulangi kata sandi" required>

            <label>Status Pengguna</label>
            <select required>
                <option value="">Pilih status</option>
                <option>Siswa</option>
                <option>Guru</option>
                <option>Mahasiswa</option>
            </select>

            <button type="submit">Daftar</button>
        </form>
    </div>

</body>
</html>
